spring.application.name=tradesphere

server.port=8080

spring.data.mongodb.uri=mongodb://localhost:27017/test
spring.data.mongodb.database=test

# JWT
jwt.secret=${JWT_SECRET:change-this-development-secret-key-change-this-development-secret-key}
